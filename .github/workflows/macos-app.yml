name: macOS 应用构建

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 上游后端 tag（留空则取最新）
        required: false
        default: ""
  schedule:
    - cron: "20 1 * * *"   # 每天看一次上游有没有新 tag，有就重新组包

env:
  UPSTREAM: jxxghp/MoviePilot

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      skip: ${{ steps.pick.outputs.skip }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          wanted="${{ inputs.tag }}"
          [ -z "$wanted" ] && wanted="$latest"
          shipped=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || echo "")
          echo "tag=$wanted" >> "$GITHUB_OUTPUT"
          if [ -z "${{ inputs.tag }}" ] && [ "$wanted" = "$shipped" ]; then
            echo "上游 $wanted 已发布过，跳过"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: decide
    if: needs.decide.outputs.skip != 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      - name: 取上游 tag
        run: git clone --depth 1 --branch "${{ needs.decide.outputs.tag }}" "https://github.com/$UPSTREAM.git" upstream

      - name: 托管层单测
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: 组包
        run: python3 packaging/build_app.py --tag "${{ needs.decide.outputs.tag }}" --backend-repo upstream --dmg

      - name: 启动自检
        # 跑包内没有 CLI 版仓库，脚本自动改测整包产物：就绪耗时、接口冒烟、
        # 插件目录重定位、TERM/KILL 后不留残留监听。
        run: packaging/lifecycle_check.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MoviePilot-${{ needs.decide.outputs.tag }}
          path: dist/*.dmg
